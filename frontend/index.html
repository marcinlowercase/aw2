<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="src/data/img/logo_square.svg"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&family=Instrument+Serif:ital,wght@0,400;1,400&display=swap"
            rel="stylesheet"
        />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>the browser of oo1 studio</title>
        <link rel="stylesheet" href="https://core.oo1.studio/outsync.css" />
        <script type="module" src="/src/main.ts" defer></script>
    </head>
    <body class="font-['Google_Sans_Flex',sans-serif]">

        <!--
          Left Line:
          Starts from 0 top (top-0) and leaves a gap equal to --layer-height from the bottom.
        -->
        <div
            class="absolute top-0 left-0 border-l border-dashed border-black z-0 pointer-events-none ml-(--device-corner-radius) bottom-(--padding)"
        ></div>

        <!-- Right Line -->
        <div
            class="absolute inset-y-0 right-0 border-r border-dashed border-black z-0 pointer-events-none mr-(--device-corner-radius)"
        ></div>

        <!-- Top Line -->
        <div
            class="absolute inset-x-0 top-0 border-t border-dashed border-black z-0 pointer-events-none mt-(--device-corner-radius)"
        ></div>

        <!--
          Bottom Line:
          Starts at --layer-height from the left, ending at 0 on the right (right-0).
        -->
        <div
            class="absolute bottom-0 right-0 border-b border-dashed border-black z-0 pointer-events-none mb-(--device-corner-radius) left-(--padding)"
        ></div>


        <!--
          Outer screen border line:
          Contains a solid background mask in the bottom-left corner to cleanly
          erase a portion of the border equal to --layer-height.
        -->
        <div
            class="absolute inset-0 border border-dashed border-[#0010ff] z-0 pointer-events-none"
            style="
                margin: var(--padding);
                border-radius: var(--layer-corner-radius);
                --layer: 1;
            "
        >
            <!--
              Bottom-Left Mask:
              Offsets slightly (-4px) to guarantee it fully hides the 1px dashed border stroke,
              ensuring a clean, blank gap of exactly --layer-height.
            -->
            <div
                class="absolute bg-white"
                style="
                border-radius: var(--layer-corner-radius);
                    bottom: -4px;
                    left: -4px;
                    width: calc(var(--layer-height) + 4px);
                    height: calc(var(--layer-height) + 4px);
                "
            ></div>
        </div>


        <!--
          Changed container to flex-col and justify-center.
          Added a gap of 8 (gap-8) to space the items nicely in the column.
        -->
        <div
            id="brand"
            class="relative flex flex-col justify-center items-center min-h-screen w-full overflow-hidden gap-8 p-[calc(var(--device-corner-radius)+var(--padding))]"
        >
            <!--
              Animated Logo (First item in the vertical stack):
              Made relative with a defined height (h-24) to establish a bounds box in the layout.
              Its absolute children are pinned left-0 top-0 to align with the text.
            -->
            <!--
              The relative container has a defined height (h-24) and width (w-full).
              Setting "inset-0 m-auto" on the absolute images forces them to center
              perfectly both vertically and horizontally inside this container.
            -->
            <div id="logo" class="relative h-25 w-25 pointer-events-none z-0">
                <img
                    src="src/data/img/lob2-a00.svg"
                    alt="logo"
                    class="absolute inset-0 m-auto h-full w-auto object-contain"
                    style="opacity: 1"
                />
                <img
                    src="src/data/img/lob2-a01.svg"
                    alt="logo"
                    class="absolute inset-0 m-auto h-full w-auto object-contain"
                    style="opacity: 0"
                />
                <img
                    src="src/data/img/lob2-a02.svg"
                    alt="logo"
                    class="absolute inset-0 m-auto h-full w-auto object-contain"
                    style="opacity: 0"
                />
                <img
                    src="src/data/img/lob2-a03.svg"
                    alt="logo"
                    class="absolute inset-0 m-auto h-full w-auto object-contain"
                    style="opacity: 0"
                />
                <img
                    src="src/data/img/lob2-a04.svg"
                    alt="logo"
                    class="absolute inset-0 m-auto h-full w-auto object-contain"
                    style="opacity: 0"
                />
                <img
                    src="src/data/img/lob2-a05.svg"
                    alt="logo"
                    class="absolute inset-0 m-auto h-full w-auto object-contain"
                    style="opacity: 0"
                />
                <img
                    src="src/data/img/lob2-a06.svg"
                    alt="logo"
                    class="absolute inset-0 m-auto h-full w-auto object-contain"
                    style="opacity: 0"
                />
                <img
                    src="src/data/img/lob2-a07.svg"
                    alt="logo"
                    class="absolute inset-0 m-auto h-full w-auto object-contain"
                    style="opacity: 0"
                />
            </div>

            <!--
              Foreground Text (Second item in the vertical stack)
            -->
            <div
                id="name"
                class="z-10 text-[2em] text-center font-['Instrument_Serif',serif] font-black leading-tight"
            >
                <span class="inline-block whitespace-nowrap">the browser</span>
                <span class="inline-block whitespace-nowrap">of <a href="https://oo1.studio" target="_blank" rel="noopener noreferrer">oo1 studio</a></span>
            </div>

            <!--
              Navigation:
              Using "border-b border-dashed border-current pb-[3px]" on the links forces
              the dashed underline to draw continuously under both the icon and the text.
            -->
            <div
                id="nav"
                class="relative z-10 text-[1em] leading-normal flex flex-col items-center justify-center font-normal gap-(--device-corner-radius) mt-4"
            >
                <!-- Row-on-landscape group for download and source -->
                <div class="flex gap-[calc(var(--padding)*4)] flex-row items-center">
                    <!-- Download Link (Google Play) -->
                    <a
                        href="https://play.google.com/store/apps/details?id=studio.oo1.browser"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="text-black inline-flex items-center gap-1 border-b border-dashed border-current pb-[3px] hover:opacity-70 transition-opacity"
                    >
                        <img
                            src="src/data/img/ic_download.svg"
                            alt=""
                            class="h-[1em] w-auto object-contain"
                        />
                        <span>download</span>
                    </a>

                    <!-- Source Link (GitHub) -->
                    <a
                        href="https://github.com/marcinlowercase/a/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="text-black inline-flex items-center gap-1 border-b border-dashed border-current pb-[3px] hover:opacity-70 transition-opacity"
                    >
                        <img
                            src="src/data/img/ic_code.svg"
                            alt=""
                            class="h-[1em] w-auto object-contain"
                        />
                        <span>source</span>
                    </a>
                </div>

                <!-- Privacy Policy Link (styled with a bottom border to match line thickness and gap) -->
                <a
                    href="/privacy-policy"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="text-black inline-flex items-center gap-1 border-b border-dashed border-current pb-[3px] hover:opacity-70 transition-opacity"
                >
                    <!--<img
                        src="src/data/img/ic_docs.svg"
                        alt=""
                        class="h-[1em] w-auto object-contain"
                    />-->
                    <span>privacy policy</span>
                </a>
            </div>
    </body>
</html>
